plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
    id 'eclipse'
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            gameDirectory = project.file('../run')
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }

        client {
            client()
            systemProperty 'MC_DEBUG_RENDER_UI_LAYERING_RECTANGLES', 'true'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('test').configure {
    //Disable builtin test as we have JUnit enabled in Xplat
    enabled(false)
}

jar {
    manifest {
        attributes([
                "Specification-Title": "${mod_name}",
                "Specification-Vendor": "vazkii",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": "${mod_name}",
                "Implementation-Version": "${archiveVersion.get()}",
                "Implementation-Vendor" :"vazkii"
        ])
    }
}

tasks.register('apiJar', Jar) {
    dependsOn classes

    from project(":Xplat").sourceSets.main.allJava
    from(sourceSets.main.allJava)
    from(sourceSets.main.output)

    include 'vazkii/patchouli/api/**'

    archiveClassifier = 'api'
}

artifacts {
    archives jar
    archives sourcesJar
    archives apiJar
}

publishing.publications.named("mavenJava") {
    artifact apiJar
}
