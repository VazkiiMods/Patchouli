plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
    id 'eclipse'
}

version = "${mc_version}-${build_number}-NEOFORGE"
if (System.getenv().RELEASE_MODE != "1") {
    version += '-SNAPSHOT'
}

repositories {
    maven {
        name = "JEI"
        url "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
}

neoForge {
    version = "21.5.0-beta"

    runs {
        configureEach {
            gameDirectory = project.file('../run')
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }

        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(":Xplat")

    compileOnly "mezz.jei:jei-1.21.5-common-api:21.5.93"
    runtimeOnly "mezz.jei:jei-1.21.5-neoforge:21.5.93"
}

tasks.named('test').configure {
    //Disable builtin test as we have JUnit enabled in Xplat
    enabled(false)
}
jar {
    manifest {
        attributes([
                "Specification-Title": "${mod_name}",
                "Specification-Vendor": "vazkii",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": "${mod_name}",
                "Implementation-Version": "${archiveVersion.get()}",
                "Implementation-Vendor" :"vazkii"
        ])
    }
}

compileJava {
    source(project(":Xplat").sourceSets.main.allSource)
}

sourcesJar {
    from project(":Xplat").sourceSets.main.allJava
}

processResources {
    from project(":Xplat").sourceSets.main.resources
}

tasks.register('apiJar', Jar) {
    dependsOn classes
    // Sources included because of MinecraftForge/ForgeGradle#369
    from project(":Xplat").sourceSets.main.allJava
    from(sourceSets.main.allJava)
    from(sourceSets.main.output)

    include 'vazkii/patchouli/api/**'

    archiveClassifier = 'api'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
            artifact sourcesJar
            artifact apiJar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
