plugins {
	id 'net.fabricmc.fabric-loom'
}

repositories {
	maven {
		name = "Modmuss"
		url = "https://maven.modmuss50.me/"
		content {
			includeGroup "me.zeroeightsix"
		}
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
		content {
			includeGroup "me.shedaniel"
			includeGroup "me.shedaniel.cloth"
		}
	}
}

loom {
	runs {
		configureEach {
			ideConfigGenerated(true)
			runDir("../run")
		}
		client {
			client()
			setConfigName("Fabric Client")
		}
		server {
			server()
			setConfigName("Fabric Server")
		}
		gameTest {
			server()
			vmArg "-Dfabric-api.gametest=1"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mc_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"

	implementation "me.zeroeightsix:fiber:${fiber_version}"
	include "me.zeroeightsix:fiber:${fiber_version}"

	//modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive = false }
	//modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

